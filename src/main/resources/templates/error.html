<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="page">
    <div class="container">
        <div class="card">
            <div class="card-body">
                <div class="page-head">
                    <h1>Something went wrong</h1>
                    <p class="muted">
                        Request failed with status <span th:text="${status}">500</span>.
                    </p>
                </div>
                <div class="alert" th:text="${message} ?: 'Please try again in a moment.'">
                    Please try again in a moment.
                </div>
                <p class="mt-16">
                    <a class="btn btn-primary" href="/">Back to the home page</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: toast}"></div>
<script src="/assets/app.js"></script>
</body>
</html>
